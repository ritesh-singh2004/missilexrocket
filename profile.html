<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile — MissileX</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{--primary:#00d4ff;--secondary:#ff6b35;--accent:#00ff88;--dark:#0a0a0f;--gray:#888;--card:#0d0d14;--border:rgba(255,255,255,0.06);}
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:var(--dark);color:#fff;font-family:'Inter',sans-serif;}
        a{text-decoration:none;color:inherit;}

        .nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:0 30px;height:60px;display:flex;justify-content:space-between;align-items:center;background:rgba(10,10,15,0.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
        .nav-logo{font-family:'Orbitron',monospace;font-size:0.85rem;font-weight:700;}
        .nav-logo span{color:var(--primary);}
        .nav-right{display:flex;gap:16px;align-items:center;}
        .nav-right a{font-family:'Orbitron',monospace;font-size:0.65rem;color:var(--gray);}
        .nav-right a:hover{color:var(--primary);}

        .container{max-width:800px;margin:0 auto;padding:90px 20px 60px;}

        .profile-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px;margin-bottom:24px;}
        .profile-header{display:flex;gap:24px;align-items:center;margin-bottom:28px;}
        .avatar-wrap{position:relative;cursor:pointer;}
        .avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;font-family:'Orbitron',monospace;font-size:2rem;font-weight:900;color:#000;overflow:hidden;}
        .avatar img{width:100%;height:100%;object-fit:cover;}
        .avatar-overlay{position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.3s;font-size:0.6rem;font-family:'Orbitron',monospace;color:#fff;}
        .avatar-wrap:hover .avatar-overlay{opacity:1;}
        .profile-info h2{font-family:'Orbitron',monospace;font-size:1.1rem;margin-bottom:4px;}
        .profile-info p{font-size:0.85rem;color:var(--gray);}
        .profile-info .role-badge{display:inline-block;font-size:0.6rem;padding:3px 10px;border-radius:4px;font-family:'Orbitron',monospace;margin-top:6px;}
        .role-badge.investor{background:rgba(0,212,255,0.15);color:var(--primary);}
        .role-badge.startup{background:rgba(255,107,53,0.15);color:var(--secondary);}
        .role-badge.student{background:rgba(255,255,255,0.08);color:var(--gray);}

        .section-title{font-family:'Orbitron',monospace;font-size:0.85rem;color:var(--primary);margin:24px 0 16px;padding-bottom:8px;border-bottom:1px solid var(--border);}
        .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
        .form-group{margin-bottom:14px;}
        .form-group label{display:block;font-family:'Orbitron',monospace;font-size:0.55rem;letter-spacing:0.1em;color:var(--gray);margin-bottom:5px;}
        .form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:#fff;font-family:'Inter',sans-serif;font-size:0.85rem;}
        .form-group textarea{min-height:80px;resize:vertical;}
        .form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--primary);}
        .form-group select option{background:#111;color:#fff;}
        .form-group.full{grid-column:1/-1;}

        .btn{font-family:'Orbitron',monospace;font-size:0.7rem;letter-spacing:0.08em;padding:12px 28px;border:none;border-radius:6px;cursor:pointer;font-weight:700;transition:all 0.3s;}
        .btn-primary{background:var(--primary);color:#000;}
        .btn-primary:hover{background:#fff;}
        .btn-secondary{background:rgba(255,255,255,0.05);color:#fff;border:1px solid var(--border);}
        .btn-secondary:hover{border-color:var(--primary);}

        .completion-bar{margin-bottom:24px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;}
        .completion-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
        .completion-header h3{font-family:'Orbitron',monospace;font-size:0.8rem;}
        .completion-header .pct{font-family:'Orbitron',monospace;font-size:1rem;color:var(--accent);font-weight:700;}
        .bar{height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden;}
        .bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--primary));transition:width 0.5s ease;}

        .checklist{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
        .check-item{font-size:0.75rem;display:flex;align-items:center;gap:6px;}
        .check-item.done{color:var(--accent);}
        .check-item .icon{font-size:0.9rem;}

        .upload-input{display:none;}

        .quick-links{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px;}
        .quick-link{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center;transition:all 0.3s;cursor:pointer;}
        .quick-link:hover{border-color:var(--primary);transform:translateY(-2px);}
        .quick-link .icon{font-size:1.5rem;margin-bottom:8px;}
        .quick-link h4{font-family:'Orbitron',monospace;font-size:0.7rem;margin-bottom:4px;}
        .quick-link p{font-size:0.7rem;color:var(--gray);}

        @media(max-width:600px){.form-grid{grid-template-columns:1fr;}.checklist{grid-template-columns:1fr;}.quick-links{grid-template-columns:1fr;}}
    </style>
</head>
<body>
    <nav class="nav">
        <a href="index.html" class="nav-logo"><span>MISSILEX</span> PROFILE</a>
        <div class="nav-right">
            <a href="index.html">HOME</a>
            <a href="#" onclick="logout()">LOGOUT</a>
        </div>
    </nav>

    <div class="container">
        <div class="profile-card">
            <div class="profile-header">
                <div class="avatar-wrap" onclick="document.getElementById('picInput').click()">
                    <div class="avatar" id="avatarDisplay">-</div>
                    <div class="avatar-overlay">📷<br>CHANGE</div>
                </div>
                <input type="file" id="picInput" class="upload-input" accept="image/*" onchange="uploadPicture(event)">
                <div class="profile-info">
                    <h2 id="userName">-</h2>
                    <p id="userEmail">-</p>
                    <span class="role-badge" id="roleBadge">-</span>
                </div>
            </div>

            <div class="completion-bar">
                <div class="completion-header"><h3>PROFILE COMPLETION</h3><span class="pct" id="compPct">0%</span></div>
                <div class="bar"><div class="bar-fill" id="compBar" style="width:0%"></div></div>
                <div class="checklist" id="checklist"></div>
            </div>

            <div class="section-title">BASIC INFORMATION</div>
            <form id="profileForm">
                <div class="form-grid">
                    <div class="form-group"><label>FULL NAME</label><input type="text" id="fName"></div>
                    <div class="form-group"><label>EMAIL</label><input type="email" id="fEmail" readonly style="opacity:0.6;"></div>
                    <div class="form-group"><label>PHONE</label><input type="tel" id="fPhone"></div>
                    <div class="form-group"><label>LOCATION</label><input type="text" id="fLocation" placeholder="City, Country"></div>
                    <div class="form-group"><label>WEBSITE</label><input type="url" id="fWebsite" placeholder="https://..."></div>
                    <div class="form-group"><label>LINKEDIN</label><input type="url" id="fLinkedin" placeholder="https://linkedin.com/in/..."></div>
                    <div class="form-group full"><label>BIO</label><textarea id="fBio" placeholder="Tell us about yourself..."></textarea></div>
                </div>
                <button type="submit" class="btn btn-primary" style="margin-top:8px;">SAVE CHANGES</button>
            </form>
        </div>

        <div class="quick-links">
            <a class="quick-link" href="dashboard.html" id="linkDashboard">
                <div class="icon">📊</div>
                <h4>MY DASHBOARD</h4>
                <p>View your activity and connections</p>
            </a>
            <a class="quick-link" href="startup-listing.html">
                <div class="icon">🚀</div>
                <h4>EXPLORE STARTUPS</h4>
                <p>Browse available startups</p>
            </a>
            <a class="quick-link" href="invest.html">
                <div class="icon">💰</div>
                <h4>INVESTMENT</h4>
                <p>Investment platform home</p>
            </a>
            <a class="quick-link" href="admin.html">
                <div class="icon">🛡️</div>
                <h4>ADMIN</h4>
                <p>Admin panel (if authorized)</p>
            </a>
        </div>
    </div>

    <script>
        const API='http://localhost:5000/api';
        let userRole=null, userData=null;

        function getTokens(){
            return {
                investor: localStorage.getItem('missilex_investor_token'),
                startup: localStorage.getItem('missilex_startup_token'),
                student: localStorage.getItem('missilex_token')
            };
        }

        function logout(){
            localStorage.removeItem('missilex_investor_token');
            localStorage.removeItem('missilex_investor');
            localStorage.removeItem('missilex_startup_token');
            localStorage.removeItem('missilex_startup');
            localStorage.removeItem('missilex_token');
            localStorage.removeItem('missilex_user');
            window.location.href='index.html';
        }

        async function apiFetch(p,o={}){
            const tokens=getTokens();
            const token=tokens.investor||tokens.startup||tokens.student;
            if(!token){window.location.href='index.html';return;}
            const h={'Content-Type':'application/json',...o.headers};
            h['Authorization']='Bearer '+token;
            const r=await fetch(API+p,{...o,headers:h});
            const d=await r.json();
            if(!r.ok)throw new Error(d.error||'Failed');
            return d;
        }

        function showNotif(m,color='var(--accent)'){
            const n=document.createElement('div');
            n.style.cssText='position:fixed;top:20px;right:20px;padding:12px 24px;background:'+color+';color:#000;font-family:Orbitron,monospace;font-size:0.7rem;border-radius:6px;z-index:10000;';
            n.textContent=m;document.body.appendChild(n);setTimeout(()=>n.remove(),3000);
        }

        async function loadProfile(){
            const tokens=getTokens();
            if(tokens.investor){
                userRole='investor';
                try{userData=await apiFetch('/investor/profile');}catch(e){}
                document.getElementById('roleBadge').className='role-badge investor';
                document.getElementById('roleBadge').textContent='INVESTOR';
                document.getElementById('linkDashboard').href='investor-dashboard.html';
            }else if(tokens.startup){
                userRole='startup';
                try{userData=await apiFetch('/startup/profile');}catch(e){}
                document.getElementById('roleBadge').className='role-badge startup';
                document.getElementById('roleBadge').textContent='STARTUP FOUNDER';
                document.getElementById('linkDashboard').href='startup-dashboard.html';
            }else if(tokens.student){
                userRole='student';
                try{userData=await apiFetch('/auth/profile');}catch(e){}
                document.getElementById('roleBadge').className='role-badge student';
                document.getElementById('roleBadge').textContent='STUDENT';
                document.getElementById('linkDashboard').href='dashboard.html';
            }else{
                window.location.href='index.html';return;
            }

            if(!userData){showNotif('Failed to load profile','var(--danger)');return;}

            document.getElementById('userName').textContent=userData.name||userData.founderName||userData.startupName||'-';
            document.getElementById('userEmail').textContent=userData.email||'-';

            if(userData.avatarImage){
                document.getElementById('avatarDisplay').innerHTML='<img src="'+userData.avatarImage+'" alt="Profile">';
            }else{
                document.getElementById('avatarDisplay').textContent=(userData.name||userData.founderName||'?').charAt(0).toUpperCase();
            }

            document.getElementById('fName').value=userData.name||userData.founderName||'';
            document.getElementById('fEmail').value=userData.email||'';
            document.getElementById('fPhone').value=userData.phone||'';
            document.getElementById('fLocation').value=userData.location||userData.city||'';
            document.getElementById('fWebsite').value=userData.website||'';
            document.getElementById('fLinkedin').value=userData.linkedin||'';
            document.getElementById('fBio').value=userData.bio||'';

            loadCompletion();
        }

        async function loadCompletion(){
            try{
                let comp;
                if(userRole==='investor')comp=await apiFetch('/investor/completion');
                else if(userRole==='startup')comp=await apiFetch('/startup/completion');
                else{comp={percentage:100,completed:8,total:8};}

                document.getElementById('compPct').textContent=comp.percentage+'%';
                document.getElementById('compBar').style.width=comp.percentage+'%';

                const checks=[
                    {label:'Name',done:!!(userData.name||userData.founderName)},
                    {label:'Email',done:!!userData.email},
                    {label:'Phone',done:!!userData.phone},
                    {label:'Bio',done:!!userData.bio},
                    {label:'Website',done:!!userData.website},
                    {label:'Profile Picture',done:!!userData.avatarImage},
                ];
                if(userRole==='investor'){
                    checks.push({label:'Investor Type',done:!!userData.investorType});
                    checks.push({label:'Sectors',done:userData.sectors?.length>0});
                }
                if(userRole==='startup'){
                    checks.push({label:'Startup Name',done:!!userData.startupName});
                    checks.push({label:'Sector',done:!!userData.sector});
                    checks.push({label:'Funding',done:!!userData.fundingStage});
                    checks.push({label:'Pitch Video',done:!!userData.pitchVideo});
                }
                document.getElementById('checklist').innerHTML=checks.map(c=>`<div class="check-item ${c.done?'done':''}"><span class="icon">${c.done?'✅':'⭕'}</span> ${c.label}</div>`).join('');
            }catch(e){}
        }

        async function uploadPicture(e){
            const file=e.target.files[0];
            if(!file)return;
            if(file.size>5*1024*1024){showNotif('Max 5MB allowed','var(--danger)');return;}
            const reader=new FileReader();
            reader.onload=async function(ev){
                const base64=ev.target.result;
                document.getElementById('avatarDisplay').innerHTML='<img src="'+base64+'" alt="Profile">';
                try{
                    await apiFetch('/auth/profile',{method:'PUT',body:JSON.stringify({avatarImage:base64})});
                    showNotif('Profile picture updated!');
                }catch(e){
                    try{
                        if(userRole==='investor')await apiFetch('/investor/profile',{method:'PUT',body:JSON.stringify({avatarImage:base64})});
                        if(userRole==='startup')await apiFetch('/startup/profile',{method:'PUT',body:JSON.stringify({avatarImage:base64})});
                        showNotif('Profile picture updated!');
                    }catch(e2){showNotif('Error saving picture','var(--danger)');}
                }
            };
            reader.readAsDataURL(file);
        }

        document.getElementById('profileForm').addEventListener('submit',async(e)=>{
            e.preventDefault();
            try{
                const data={
                    name:document.getElementById('fName').value.trim(),
                    phone:document.getElementById('fPhone').value.trim(),
                    location:document.getElementById('fLocation').value.trim(),
                    website:document.getElementById('fWebsite').value.trim(),
                    linkedin:document.getElementById('fLinkedin').value.trim(),
                    bio:document.getElementById('fBio').value.trim()
                };
                if(userRole==='investor')await apiFetch('/investor/profile',{method:'PUT',body:JSON.stringify(data)});
                else if(userRole==='startup')await apiFetch('/startup/profile',{method:'PUT',body:JSON.stringify(data)});
                else await apiFetch('/auth/profile',{method:'PUT',body:JSON.stringify(data)});
                showNotif('Profile saved!');
                await loadProfile();
            }catch(e){showNotif('Error: '+e.message,'var(--danger)');}
        });

        loadProfile();
    </script>
</body>
</html>
