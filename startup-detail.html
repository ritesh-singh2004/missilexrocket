<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startup Details — MissileX Invest</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{--primary:#00d4ff;--secondary:#ff6b35;--accent:#00ff88;--dark:#0a0a0f;--gray:#888;--card:#0d0d14;--border:rgba(255,255,255,0.06);}
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:var(--dark);color:#fff;font-family:'Rajdhani',sans-serif;}
        a{text-decoration:none;color:inherit;}
        .nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:14px 30px;display:flex;justify-content:space-between;align-items:center;background:rgba(10,10,15,0.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
        .nav-logo{font-family:'Orbitron',monospace;font-size:0.9rem;font-weight:700;}
        .nav-logo span{color:var(--primary);}
        .nav-links{display:flex;gap:20px;align-items:center;}
        .nav-links a{font-family:'Orbitron',monospace;font-size:0.65rem;color:var(--gray);}
        .nav-links a:hover{color:var(--primary);}

        .container{max-width:900px;margin:0 auto;padding:90px 20px 60px;}
        .back-link{font-family:'Orbitron',monospace;font-size:0.7rem;color:var(--gray);margin-bottom:24px;display:inline-block;}
        .back-link:hover{color:var(--primary);}

        .detail-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px;margin-bottom:24px;}
        .detail-header{display:flex;gap:20px;align-items:center;margin-bottom:24px;}
        .detail-avatar{width:72px;height:72px;border-radius:16px;background:linear-gradient(135deg,var(--secondary),#cc5522);display:flex;align-items:center;justify-content:center;font-family:'Orbitron',monospace;font-size:1.8rem;font-weight:900;color:#000;flex-shrink:0;}
        .detail-name{font-family:'Orbitron',monospace;font-size:1.4rem;margin-bottom:4px;}
        .detail-meta{font-size:0.85rem;color:var(--gray);}
        .detail-meta span{margin-right:12px;}

        .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px;}
        .info-box{background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:10px;padding:16px;}
        .info-box .label{font-family:'Orbitron',monospace;font-size:0.6rem;color:var(--gray);letter-spacing:0.1em;margin-bottom:6px;}
        .info-box .value{font-family:'Orbitron',monospace;font-size:1rem;color:var(--primary);font-weight:700;}
        .info-box .value.secondary{color:var(--secondary);}

        .section-heading{font-family:'Orbitron',monospace;font-size:0.85rem;color:var(--primary);margin:24px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border);}
        .section-heading.orange{color:var(--secondary);}
        .section-heading.green{color:var(--accent);}
        .section-text{font-size:0.9rem;color:var(--gray);line-height:1.7;white-space:pre-wrap;}

        .video-container{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:12px;margin:16px 0;}
        .video-container iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;}

        .benefit-box{background:rgba(0,212,255,0.04);border:1px solid rgba(0,212,255,0.12);border-radius:10px;padding:20px;margin:12px 0;}
        .benefit-box.green{background:rgba(0,255,136,0.04);border-color:rgba(0,255,136,0.12);}
        .benefit-box h4{font-family:'Orbitron',monospace;font-size:0.75rem;color:var(--primary);margin-bottom:8px;}
        .benefit-box.green h4{color:var(--accent);}

        .action-bar{display:flex;gap:12px;flex-wrap:wrap;}
        .action-bar a,.action-bar button{font-family:'Orbitron',monospace;font-size:0.7rem;letter-spacing:0.08em;padding:12px 24px;border-radius:6px;cursor:pointer;font-weight:700;transition:all 0.3s;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
        .btn-primary{background:var(--primary);color:#000;border:none;}
        .btn-primary:hover{background:#fff;}
        .btn-secondary{background:rgba(255,255,255,0.05);color:#fff;border:1px solid var(--border);}
        .btn-secondary:hover{border-color:var(--primary);}
        .btn-connected{background:rgba(0,255,136,0.1);color:var(--accent);border:1px solid rgba(0,255,136,0.3);cursor:default;}

        .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:1000;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
        .modal-overlay.active{display:flex;}
        .modal{background:#111;border:1px solid var(--border);border-radius:12px;padding:30px;width:90%;max-width:500px;position:relative;}
        .modal h2{font-family:'Orbitron',monospace;font-size:1rem;color:var(--primary);margin-bottom:16px;}
        .modal-close{position:absolute;top:16px;right:20px;background:none;border:none;color:var(--gray);font-size:1.5rem;cursor:pointer;}
        .form-group{margin-bottom:16px;}
        .form-group label{display:block;font-family:'Orbitron',monospace;font-size:0.6rem;letter-spacing:0.1em;color:var(--gray);margin-bottom:6px;}
        .form-group textarea{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:#fff;font-family:'Rajdhani',sans-serif;font-size:0.9rem;min-height:100px;resize:vertical;}
        .form-group textarea:focus{outline:none;border-color:var(--primary);}

        .empty{text-align:center;padding:60px 20px;color:var(--gray);}
        .not-found{text-align:center;padding:100px 20px;color:var(--gray);font-family:'Orbitron',monospace;}

        @media(max-width:768px){.info-grid{grid-template-columns:1fr;}.detail-header{flex-direction:column;text-align:center;}}
    </style>
</head>
<body>
    <nav class="nav">
        <a href="invest.html" class="nav-logo"><span>MISSILEX</span> INVEST</a>
        <div class="nav-links">
            <a href="startup-listing.html">ALL STARTUPS</a>
            <a href="investor-login.html">INVESTOR LOGIN</a>
            <a href="startup-login.html">STARTUP LOGIN</a>
        </div>
    </nav>

    <div class="container">
        <a href="startup-listing.html" class="back-link">← BACK TO ALL STARTUPS</a>
        <div id="detailContent"><div class="not-found">Loading...</div></div>
    </div>

    <div class="modal-overlay" id="interestModal">
        <div class="modal">
            <button class="modal-close" onclick="closeModal('interestModal')">&times;</button>
            <h2>EXPRESS INTEREST</h2>
            <p style="color:var(--gray);font-size:0.85rem;margin-bottom:16px;">Send a message to the founder of <strong id="modalStartupName"></strong>.</p>
            <div class="form-group"><label>YOUR MESSAGE</label><textarea id="interestMsg" placeholder="Hi, I'm interested in your startup. I'd love to learn more about..."></textarea></div>
            <button class="btn btn-primary" onclick="submitInterest()" style="width:100%;">SEND INTEREST</button>
        </div>
    </div>

    <script>
        const API='http://localhost:5000/api';
        const params=new URLSearchParams(window.location.search);
        const startupId=params.get('id');
        let startupData=null;
        let investorToken=localStorage.getItem('missilex_investor_token');

        function openModal(id){document.getElementById(id).classList.add('active');}
        function closeModal(id){document.getElementById(id).classList.remove('active');}
        function showNotif(m){const n=document.createElement('div');n.style.cssText='position:fixed;top:20px;right:20px;padding:15px 30px;background:var(--primary);color:#000;font-family:Orbitron,monospace;font-size:0.75rem;letter-spacing:0.1em;border-radius:6px;z-index:10000;';n.textContent=m;document.body.appendChild(n);setTimeout(()=>{n.style.opacity='0';n.style.transition='opacity 0.3s';setTimeout(()=>n.remove(),300);},3000);}

        async function loadStartup(){
            if(!startupId){document.getElementById('detailContent').innerHTML='<div class="not-found">No startup specified.</div>';return;}
            try{
                const res=await fetch(API+'/startups/'+startupId);
                if(!res.ok){document.getElementById('detailContent').innerHTML='<div class="not-found">Startup not found.</div>';return;}
                startupData=await res.json();
                renderDetail();
            }catch(e){document.getElementById('detailContent').innerHTML='<div class="not-found">Failed to load.</div>';}
        }

        function getVideoEmbed(url){
            if(!url)return null;
            const match=url.match(/(?:v=|\/embed\/|youtu\.be\/)([\w-]+)/);
            return match?'https://www.youtube.com/embed/'+match[1]:null;
        }

        function renderDetail(){
            const s=startupData;
            const videoEmbed=getVideoEmbed(s.pitchVideo);
            let html=`<div class="detail-card">
                <div class="detail-header">
                    <div class="detail-avatar">${s.avatar||s.startupName.charAt(0)}</div>
                    <div>
                        <div class="detail-name">${s.startupName}</div>
                        <div class="detail-meta">
                            <span>${s.sector||'N/A'}</span>
                            <span>·</span>
                            <span>${s.fundingStage||'N/A'}</span>
                            <span>·</span>
                            <span>by ${s.founderName}</span>
                        </div>
                    </div>
                </div>

                <div class="info-grid">
                    <div class="info-box"><div class="label">FUNDING REQUIRED</div><div class="value">₹${s.fundingAmount||0} Lakhs</div></div>
                    <div class="info-box"><div class="label">FUNDING STAGE</div><div class="value secondary">${s.fundingStage||'N/A'}</div></div>
                    <div class="info-box"><div class="label">SECTOR</div><div class="value">${s.sector||'N/A'}</div></div>
                    <div class="info-box"><div class="label">NATURE</div><div class="value secondary">${s.nature||'N/A'}</div></div>
                </div>

                <div class="action-bar">
                    ${investorToken?`<button class="btn btn-primary" onclick="openInterestModal()">EXPRESS INTEREST</button>`:`<a href="investor-login.html" class="btn btn-primary">LOGIN TO CONNECT</a>`}
                    ${s.website?`<a href="${s.website}" target="_blank" class="btn btn-secondary">🌐 VISIT WEBSITE</a>`:''}
                    ${s.pitchDeck?`<a href="${s.pitchDeck}" target="_blank" class="btn btn-secondary">📊 VIEW PITCH DECK</a>`:''}
                </div>
            </div>`;

            if(videoEmbed){
                html+=`<div class="detail-card"><h3 style="font-family:'Orbitron',monospace;font-size:0.9rem;color:var(--secondary);margin-bottom:16px;">🎥 PITCH VIDEO</h3><div class="video-container"><iframe src="${videoEmbed}" allowfullscreen></iframe></div></div>`;
            }

            if(s.description){
                html+=`<div class="detail-card"><div class="section-heading">ABOUT THE STARTUP</div><div class="section-text">${s.description}</div></div>`;
            }

            if(s.useOfFunds){
                html+=`<div class="detail-card"><div class="section-heading orange">USE OF FUNDS</div><div class="section-text">${s.useOfFunds}</div></div>`;
            }

            if(s.govtBenefits){
                html+=`<div class="detail-card"><div class="benefit-box"><h4>🏛️ GOVERNMENT BENEFITS</h4><div class="section-text">${s.govtBenefits}</div></div></div>`;
            }

            if(s.societyBenefits){
                html+=`<div class="detail-card"><div class="benefit-box green"><h4>🌍 SOCIETY / INDUSTRY BENEFITS</h4><div class="section-text">${s.societyBenefits}</div></div></div>`;
            }

            if(s.teamDetails){
                html+=`<div class="detail-card"><div class="section-heading green">TEAM</div><div class="section-text">${s.teamDetails}</div></div>`;
            }

            if(s.traction){
                html+=`<div class="detail-card"><div class="section-heading">CURRENT TRACTION</div><div class="section-text">${s.traction}</div></div>`;
            }

            document.getElementById('detailContent').innerHTML=html;
        }

        function openInterestModal(){
            if(!investorToken){window.location.href='investor-login.html';return;}
            document.getElementById('modalStartupName').textContent=startupData.startupName;
            openModal('interestModal');
        }

        async function submitInterest(){
            try{
                const token=investorToken;
                const res=await fetch(API+'/investor/interest',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({startupId,message:document.getElementById('interestMsg').value.trim()})});
                const json=await res.json();
                if(!res.ok){showNotif(json.error);return;}
                closeModal('interestModal');showNotif('Interest sent! Founder notified.');document.getElementById('interestMsg').value='';
            }catch(e){showNotif('Login as investor first');}
        }

        loadStartup();
    </script>
</body>
</html>
