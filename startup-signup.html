<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startup Signup — MissileX Invest</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{--primary:#00d4ff;--secondary:#ff6b35;--dark:#0a0a0f;--gray:#888;--border:rgba(255,255,255,0.06);}
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:var(--dark);color:#fff;font-family:'Rajdhani',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
        .auth-card{background:#0d0d14;border:1px solid var(--border);border-radius:16px;padding:40px;width:100%;max-width:500px;}
        .auth-card h1{font-family:'Orbitron',monospace;font-size:1.3rem;margin-bottom:8px;}
        .auth-card h1 span{color:var(--secondary);}
        .auth-card .subtitle{font-size:0.85rem;color:var(--gray);margin-bottom:30px;}
        .form-group{margin-bottom:16px;}
        .form-group label{display:block;font-family:'Orbitron',monospace;font-size:0.6rem;letter-spacing:0.1em;color:var(--gray);margin-bottom:6px;}
        .form-group input,.form-group select{width:100%;padding:12px 16px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:#fff;font-family:'Rajdhani',sans-serif;font-size:0.9rem;}
        .form-group input:focus,.form-group select:focus{outline:none;border-color:var(--secondary);}
        .form-group select option{background:#111;color:#fff;}
        .btn{width:100%;padding:14px;font-family:'Orbitron',monospace;font-size:0.8rem;letter-spacing:0.1em;border:none;border-radius:6px;cursor:pointer;font-weight:700;background:linear-gradient(135deg,var(--secondary),#cc5522);color:#fff;transition:all 0.3s;}
        .btn:hover{box-shadow:0 5px 20px rgba(255,107,53,0.3);}
        .switch{text-align:center;margin-top:20px;font-size:0.85rem;color:var(--gray);}
        .switch a{color:var(--secondary);}
        .error{background:rgba(255,50,50,0.1);border:1px solid rgba(255,50,50,0.3);border-radius:6px;padding:10px;margin-bottom:16px;font-size:0.8rem;color:#ff5050;display:none;}
        .success{background:rgba(0,255,136,0.1);border:1px solid rgba(0,255,136,0.3);border-radius:6px;padding:10px;margin-bottom:16px;font-size:0.8rem;color:#00ff88;display:none;}
    </style>
</head>
<body>
    <div class="auth-card">
        <h1>STARTUP <span>SIGNUP</span></h1>
        <p class="subtitle">Register your startup and connect with investors.</p>
        <div class="error" id="errMsg"></div>
        <div class="success" id="succMsg"></div>
        <form id="signupForm">
            <div class="form-group"><label>FOUNDER NAME *</label><input type="text" id="name" placeholder="Your full name" required></div>
            <div class="form-group"><label>STARTUP NAME *</label><input type="text" id="startupName" placeholder="Your startup name" required></div>
            <div class="form-group"><label>EMAIL *</label><input type="email" id="email" placeholder="founder@startup.com" required></div>
            <div class="form-group"><label>PHONE *</label><input type="tel" id="phone" placeholder="+91 98765 43210" required></div>
            <div class="form-group"><label>PASSWORD *</label><input type="password" id="password" placeholder="Min 6 characters" required></div>
            <div class="form-group"><label>SECTOR *</label>
                <select id="sector" required>
                    <option value="">Select sector</option>
                    <option value="AI">AI / Machine Learning</option>
                    <option value="Aerospace">Aerospace</option>
                    <option value="Drone">Drone / UAV</option>
                    <option value="Defence">Defence Tech</option>
                    <option value="Deep Tech">Deep Tech</option>
                    <option value="Cyber Security">Cyber Security</option>
                    <option value="Space Tech">Space Tech</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <button type="submit" class="btn">CREATE ACCOUNT</button>
        </form>
        <div class="switch">Already a founder? <a href="startup-login.html">Login here</a></div>
        <div class="switch" style="margin-top:10px;"><a href="invest.html">← Back to Home</a></div>
    </div>
    <script>
        const API='http://localhost:5000/api';
        document.getElementById('signupForm').addEventListener('submit',async(e)=>{
            e.preventDefault();
            const errEl=document.getElementById('errMsg');const succEl=document.getElementById('succMsg');
            errEl.style.display='none';succEl.style.display='none';
            try{
                const res=await fetch(API+'/startup/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
                    name:document.getElementById('name').value.trim(),
                    startupName:document.getElementById('startupName').value.trim(),
                    email:document.getElementById('email').value.trim(),
                    phone:document.getElementById('phone').value.trim(),
                    password:document.getElementById('password').value
                })});
                const json=await res.json();
                if(!res.ok){errEl.textContent=json.error;errEl.style.display='block';return;}
                localStorage.setItem('missilex_startup_token',json.token);
                localStorage.setItem('missilex_startup',JSON.stringify(json.user));
                succEl.textContent='Account created! Redirecting...';succEl.style.display='block';
                setTimeout(()=>window.location.href='startup-dashboard.html',1000);
            }catch(e){errEl.textContent='Connection failed';errEl.style.display='block';}
        });
    </script>
</body>
</html>
